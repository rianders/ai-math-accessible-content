<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI as An Accessibility Improvement Tool</title>

    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: Arial; font-size: 20px; color: #666;">
            Loading presentation...
        </div>
    </div>

    <!-- Load compiled presentation -->
    <script src="presentation.js"></script>

    <!-- Mount the app -->
    <script>
        window.addEventListener('load', function() {
            try {
                console.log('Mounting presentation...');
                const Presentation = PresentationModule.default;
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(Presentation));
                console.log('Presentation mounted successfully');
            } catch (error) {
                console.error('Error mounting presentation:', error);
                document.getElementById('root').innerHTML = `
                    <div style="padding: 40px; font-family: Arial; color: #d32f2f;">
                        <h1>Error Loading Presentation</h1>
                        <p>${error.message}</p>
                        <p>Please check the browser console for more details.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
